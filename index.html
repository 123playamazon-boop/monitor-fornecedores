<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitor de Fornecedores</title>
<style>
[hidden]{display:none!important}
:root{--bg:#f4f5f7;--surface:#fff;--line:#dcdfe6;--fg:#1c2230;--muted:#5b6475;--accent:#3b6cff;--ok:#128a4e;--okb:#e3f5ea;--warn:#9a6b00;--warnb:#fdf1d6;--crit:#c02a2a;--critb:#fbe3e3}
@media(prefers-color-scheme:dark){:root{--bg:#0e1118;--surface:#171b24;--line:#2b313d;--fg:#e7ebf2;--muted:#9aa3b2;--accent:#5e86ff;--ok:#3ec77e;--okb:#122a1e;--warn:#e8b64a;--warnb:#2d2411;--crit:#ff6b6b;--critb:#2d1515;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px}
h1{font-size:1.25rem;margin:0}.sub{color:var(--muted);font-size:.82rem;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
@media(max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile .n{font-size:1.7rem;font-weight:800}.tile .l{font-size:.72rem;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
#t-ok{color:var(--ok)}#t-warn{color:var(--warn)}#t-crit{color:var(--crit)}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;font-weight:700;font-size:.82rem;cursor:pointer}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:820px}
th{text-align:left;font-size:.68rem;text-transform:uppercase;color:var(--muted);font-weight:700;padding:11px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:.86rem}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tr.OK{border-left:4px solid var(--ok)}tr.ATENCAO{border-left:4px solid var(--warn)}tr.CRITICO{border-left:4px solid var(--crit)}
.prod{font-weight:700}.prod a{color:var(--muted);font-size:.72rem;margin-left:6px}.sku{display:block;color:var(--muted);font-size:.7rem}
.pillOK{background:var(--okb);color:var(--ok);padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:800}
.pillATENCAO{background:var(--warnb);color:var(--warn);padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:800}
.pillCRITICO{background:var(--critb);color:var(--crit);padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:800}
.stkin{color:var(--ok);font-weight:700;font-size:.78rem}.stkout{color:var(--crit);font-weight:700;font-size:.78rem}
.acao{font-size:.76rem;color:var(--muted);margin-top:2px}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:320px;width:100%;text-align:center}
input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);margin:8px 0}
button.go{width:100%;padding:9px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.foot{color:var(--muted);font-size:.74rem;margin-top:12px}
.load{color:var(--muted);font-size:.85rem;padding:16px 0}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="box"><h1>Monitor de Fornecedores</h1><p class="sub">Acesso do time 123Play</p><input id="pw" type="password" placeholder="senha"><button class="go" id="go">Entrar</button><div id="err" style="color:var(--crit);font-size:.8rem;margin-top:6px"></div></div></div>
<div class="wrap" id="app" hidden>
<h1>Monitor de Fornecedores</h1><div class="sub">Preços do Walmart buscados automaticamente todo dia.</div>
<div class="tiles"><div class="tile"><div class="n" id="t-total">-</div><div class="l">Produtos</div></div><div class="tile"><div class="n" id="t-ok">-</div><div class="l">OK</div></div><div class="tile"><div class="n" id="t-warn">-</div><div class="l">Atencao</div></div><div class="tile"><div class="n" id="t-crit">-</div><div class="l">Critico</div></div></div>
<div class="tabs"><button class="tab" id="tab-all" data-t="all">Todos</button><button class="tab" id="tab-in" data-t="in">Em estoque</button><button class="tab" id="tab-out" data-t="out">Fora de estoque</button></div>
<div class="tw"><table><thead><tr><th>Produto</th><th class="num">Venda</th><th class="num">Custo Walmart</th><th class="num">Lucro</th><th class="num">Margem</th><th>Estoque</th><th>Decisao</th><th>Checado</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="load">Carregando dados ao vivo...</td></tr></tbody></table></div>
<div class="foot" id="foot"></div>
</div>
<script>
var API='https://wimfpytgnokyjtomhmlz.supabase.co/functions/v1/products-json';
var DATA=[];
var tab='all';
function esc(x){return String(x==null?'':x).replace(/[&<>]/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':'&gt;'})}
function money(v){return (v==null||isNaN(Number(v)))?'-':'$'+Number(v).toFixed(2)}
function when(t){if(!t)return '-';var d=new Date(t);return isNaN(d)?'-':d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function render(){
 var inC=DATA.filter(function(p){return p.in_stock}).length;
 document.getElementById('tab-in').textContent='Em estoque ('+inC+')';
 document.getElementById('tab-out').textContent='Fora de estoque ('+(DATA.length-inC)+')';
 var c={OK:0,ATENCAO:0,CRITICO:0};
 DATA.forEach(function(p){if(c[p.last_decision]!=null)c[p.last_decision]++});
 document.getElementById('t-total').textContent=DATA.length;
 document.getElementById('t-ok').textContent=c.OK;
 document.getElementById('t-warn').textContent=c.ATENCAO;
 document.getElementById('t-crit').textContent=c.CRITICO;
 var list=DATA.filter(function(p){return tab==='all'?true:(tab==='in'?p.in_stock:!p.in_stock)});
 var ord={CRITICO:0,ATENCAO:1,OK:2};
 list.sort(function(a,b){return (ord[a.last_decision]||9)-(ord[b.last_decision]||9)});
 var h='';
 list.forEach(function(p){
  var m=p.amazon_price?Math.round(Number(p.last_profit)/Number(p.amazon_price)*100):null;
  var lbl=p.last_decision==='CRITICO'?'CRÍTICO':p.last_decision==='ATENCAO'?'ATENÇÃO':'OK';
  var lk=p.supplier_url?' <a href="'+p.supplier_url+'" target="_blank">link</a>':'';
  h+='<tr class="'+(p.last_decision||'OK')+'"><td><span class="prod">'+esc(p.name)+lk+'</span><span class="sku">'+esc(p.amazon_sku||'')+'</span></td><td class="num">'+money(p.amazon_price)+'</td><td class="num">'+money(p.supplier_price)+'</td><td class="num">'+money(p.last_profit)+'</td><td class="num">'+(m==null?'-':m+'%')+'</td><td><span class="'+(p.in_stock?'stkin':'stkout')+'">'+(p.in_stock?'EM ESTOQUE':'SEM ESTOQUE')+'</span></td><td><span class="pill'+(p.last_decision||'OK')+'">'+lbl+'</span><div class="acao">'+esc(p.last_acao||'')+'</div></td><td class="num">'+when(p.last_checked_at)+'</td></tr>';
 });
 document.getElementById('rows').innerHTML=h||'<tr><td colspan="8" style="padding:24px;text-align:center;color:var(--muted)">Nenhum produto nessa aba.</td></tr>';
 var dts=DATA.map(function(p){return p.last_checked_at}).filter(Boolean).sort();
 document.getElementById('foot').textContent='Última busca automática: '+when(dts[dts.length-1])+' · o robô confere o Walmart todo dia e te avisa por e-mail.';
}
function load(){
 fetch(API).then(function(r){return r.json()}).then(function(j){DATA=Array.isArray(j)?j:[];render()}).catch(function(e){
  document.getElementById('rows').innerHTML='<tr><td colspan="8" style="padding:20px;text-align:center;color:var(--crit)">Erro ao carregar dados. Tentando de novo...</td></tr>';
 });
}
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){b.onclick=function(){tab=b.getAttribute('data-t');Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){x.classList.remove('on')});b.classList.add('on');render()}});
function unlock(){document.getElementById('gate').hidden=true;document.getElementById('app').hidden=false;document.getElementById('tab-all').classList.add('on');load();}
try{if(sessionStorage.getItem('mf')==='1')unlock()}catch(e){}
document.getElementById('go').onclick=function(){if(document.getElementById('pw').value==='123play'){try{sessionStorage.setItem('mf','1')}catch(e){}unlock()}else{document.getElementById('err').textContent='Senha incorreta.'}};
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('go').click()});
setInterval(function(){if(!document.getElementById('app').hidden)load()},300000);
</script>
</body>
</html>
